name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Release
            os: windows-latest
            triplet: x64-windows
            build_dir: build/gha-windows
            artifact_dir: build/gha-windows/Release
            ort_url: https://github.com/microsoft/onnxruntime/releases/download/v1.17.1/onnxruntime-win-x64-1.17.1.zip
            ort_archive: deps/onnxruntime-win-x64-1.17.1.zip
            ort_root: deps/onnxruntime-win-x64-1.17.1
            package_name: bert-inference-windows-x64.zip
          - name: Ubuntu Release
            os: ubuntu-latest
            triplet: x64-linux
            build_dir: build/gha-linux
            artifact_dir: build/gha-linux
            ort_url: https://github.com/microsoft/onnxruntime/releases/download/v1.17.1/onnxruntime-linux-x64-1.17.1.tgz
            ort_archive: deps/onnxruntime-linux-x64-1.17.1.tgz
            ort_root: deps/onnxruntime-linux-x64-1.17.1
            package_name: bert-inference-linux-x64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: .github/workflows/release.yml

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install onnx grpcio protobuf

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h

      - name: Cache vcpkg install root
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: ${{ runner.os }}-${{ matrix.triplet }}-vcpkg-${{ hashFiles('vcpkg.json', 'triplets/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.triplet }}-vcpkg-

      - name: Cache ONNX Runtime archive
        uses: actions/cache@v4
        with:
          path: ${{ matrix.ort_archive }}
          key: ${{ runner.os }}-ort-release-${{ hashFiles('.github/workflows/release.yml') }}-${{ matrix.ort_archive }}

      - name: Install Ubuntu build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config curl tar unzip zip ccache

      - name: Cache ccache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-${{ matrix.triplet }}-ccache-${{ hashFiles('CMakeLists.txt', 'src/**', 'proto/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.triplet }}-ccache-

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path vcpkg)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          }
          & .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Bootstrap vcpkg (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ ! -d vcpkg ]]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          fi
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\vcpkg\vcpkg.exe install --triplet ${{ matrix.triplet }} --x-manifest-root="$pwd" --x-install-root="$pwd\vcpkg_installed" --clean-after-build

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./vcpkg/vcpkg install --triplet ${{ matrix.triplet }} --x-manifest-root="$GITHUB_WORKSPACE" --x-install-root="$GITHUB_WORKSPACE/vcpkg_installed" --clean-after-build

      - name: Download ONNX Runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\.github\scripts\download-onnxruntime.ps1 `
            -Url "${{ matrix.ort_url }}" `
            -ArchivePath "${{ github.workspace }}\${{ matrix.ort_archive }}" `
            -ExtractRoot "${{ github.workspace }}\deps" `
            -ExpectedRoot "${{ github.workspace }}\${{ matrix.ort_root }}"

      - name: Download ONNX Runtime (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x .github/scripts/download-onnxruntime.sh
          ./.github/scripts/download-onnxruntime.sh \
            "${{ matrix.ort_url }}" \
            "${{ github.workspace }}/${{ matrix.ort_archive }}" \
            "${{ github.workspace }}/deps" \
            "${{ github.workspace }}/${{ matrix.ort_root }}"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B "${{ matrix.build_dir }}" `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            -DBERT_VCPKG_TRIPLET=${{ matrix.triplet }} `
            -DBERT_USE_ONNXRUNTIME_GPU=OFF `
            -DONNXRUNTIME_CPU_ROOT="${{ github.workspace }}\${{ matrix.ort_root }}"

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_DIR: ~/.cache/ccache
        run: |
          ccache --set-config=max_size=500M
          ccache --zero-stats || true
          cmake -S . -B "${{ matrix.build_dir }}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBERT_VCPKG_TRIPLET=${{ matrix.triplet }} \
            -DBERT_USE_ONNXRUNTIME_GPU=OFF \
            -DONNXRUNTIME_CPU_ROOT="${{ github.workspace }}/${{ matrix.ort_root }}"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build "${{ matrix.build_dir }}" --config Release --parallel

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_DIR: ~/.cache/ccache
        run: |
          cmake --build "${{ matrix.build_dir }}" --parallel
          ccache --show-stats || true

      - name: Generate smoke-test model
        run: |
          python .github/scripts/create_smoke_test_model.py --output build/smoke/bert_smoke_test.onnx

      - name: Run smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python .github/scripts/run_smoke_test.py `
            --server "${{ github.workspace }}\${{ matrix.artifact_dir }}\bert_inference_server.exe" `
            --client "${{ github.workspace }}\${{ matrix.artifact_dir }}\bert_inference_client.exe" `
            --model "${{ github.workspace }}\build\smoke\bert_smoke_test.onnx" `
            --health-probe "${{ github.workspace }}\tools\grpc_health_probe.py" `
            --target 127.0.0.1:50051

      - name: Run smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python .github/scripts/run_smoke_test.py \
            --server "${{ github.workspace }}/${{ matrix.artifact_dir }}/bert_inference_server" \
            --client "${{ github.workspace }}/${{ matrix.artifact_dir }}/bert_inference_client" \
            --model "${{ github.workspace }}/build/smoke/bert_smoke_test.onnx" \
            --health-probe "${{ github.workspace }}/tools/grpc_health_probe.py" \
            --target 127.0.0.1:50051

      - name: Package release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stageDir = Join-Path $pwd "dist\windows-x64"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item -LiteralPath README.md -Destination $stageDir
          Copy-Item -LiteralPath tools\grpc_health_probe.py -Destination $stageDir
          Copy-Item -LiteralPath "${{ matrix.artifact_dir }}\bert_inference_server.exe" -Destination $stageDir
          Copy-Item -LiteralPath "${{ matrix.artifact_dir }}\bert_inference_client.exe" -Destination $stageDir
          Copy-Item -LiteralPath "${{ matrix.artifact_dir }}\bert_benchmark_client.exe" -Destination $stageDir
          Get-ChildItem "${{ matrix.artifact_dir }}" -Filter *.dll | Copy-Item -Destination $stageDir
          Compress-Archive -Path "$stageDir\*" -DestinationPath (Join-Path $pwd "dist\${{ matrix.package_name }}") -Force

      - name: Package release (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          stage_dir="$GITHUB_WORKSPACE/dist/linux-x64"
          mkdir -p "$stage_dir"
          cp README.md "$stage_dir/"
          cp tools/grpc_health_probe.py "$stage_dir/"
          cp "${{ matrix.artifact_dir }}/bert_inference_server" "$stage_dir/"
          cp "${{ matrix.artifact_dir }}/bert_inference_client" "$stage_dir/"
          cp "${{ matrix.artifact_dir }}/bert_benchmark_client" "$stage_dir/"
          shopt -s nullglob
          for sofile in "${{ matrix.artifact_dir }}"/*.so*; do
            cp "$sofile" "$stage_dir/"
          done
          tar -C "$GITHUB_WORKSPACE/dist" -czf "$GITHUB_WORKSPACE/dist/${{ matrix.package_name }}" linux-x64

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ matrix.triplet }}
          if-no-files-found: error
          path: dist/${{ matrix.package_name }}

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-package-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*
